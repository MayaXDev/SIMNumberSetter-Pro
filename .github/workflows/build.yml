name: Build & Release SIM Number Setter Pro

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/SIMNumberSetter_v1.1_MayaXDev.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/SIMNumberSetter_v1.1_MayaXDev_Release.apk
          echo "Artifacts prepared successfully."
          ls -lh release-artifacts/

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SIMNumberSetter-APKs
          path: release-artifacts/*

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1' }}
          name: "SIM Number Setter Pro v1.1 Cyber Edition"
          body: |
            ## ⚡ SIM Number Setter Pro v1.1 Cyber Edition
            **Engineered by [@MayaXDev](https://t.me/MayaXDev) & [@Itcalldeveloper](https://t.me/Itcalldeveloper)**

            Automated GitHub Actions CI/CD Build.

            ### 🚀 Highlights:
            - **Package:** `com.mayaxdev.simnumbersetter`
            - **Dual-Vector Telephony Engine:** LSPosed Hook + Instant Root Telephony Failover (`content://telephony/siminfo`).
            - **Dual-SIM Slot Selection:** Independent slot programming for Slot 0 (SIM 1) and Slot 1 (SIM 2).
            - **Zero-Reboot Telephony Cycler:** Instant `com.android.phone` restart via root shell.
            - **One-Click Privilege Manager:** Auto-grants `READ_PHONE_STATE`, `READ_PHONE_NUMBERS`, and `DUMP`.
            - **Cyberpunk UI:** Custom SIM chip iconography, pure vector drawables, dynamic Monet styling.
            - **Channels:** [Telegram Channel (@MayaXDev)](https://t.me/MayaXDev) · [Developer Hub (@Itcalldeveloper)](https://t.me/Itcalldeveloper)
          files: |
            release-artifacts/SIMNumberSetter_v1.1_MayaXDev.apk
            release-artifacts/SIMNumberSetter_v1.1_MayaXDev_Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
