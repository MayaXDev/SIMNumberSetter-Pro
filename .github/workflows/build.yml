name: Build & Release SIM Number Setter Pro

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/SIMNumberSetter_v1.1_MayaXDev.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/SIMNumberSetter_v1.1_MayaXDev_Release.apk
          echo "Artifacts prepared successfully."
          ls -lh release-artifacts/

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SIMNumberSetter-APKs
          path: release-artifacts/*

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.1' }}
          name: "SIM Number Setter Pro v1.1 (Cyber Edition)"
          body: |
            ## ⚡ SIM Number Setter Pro v1.1 Cyber Edition
            **Engineered by [@MayaXDev](https://t.me/MayaXDev) & [@Itcalldeveloper](https://t.me/Itcalldeveloper)**

            Official High-Performance Release with Universal Root & LSPosed Telephony Engine.

            ### 🚀 What's New & Highlights:
            - **New Visual Identity:** High-resolution Cyber Red Hacker SIM icon.
            - **Universal Compatibility:** Android 8.0 (Oreo) up to Android 15 & Android 16 (Baklava).
            - **Clean & Safe Console:** Built-in live telephony log monitor (Logcat + SimInfo table inspection).
            - **Conflict Shield:** Automated 1-click uninstaller for legacy obsolete packages.
            - **Dual-SIM Mastery:** Slot 0 (SIM 1) and Slot 1 (SIM 2) independent programming.
            - **Zero-Reboot Hot Telephony Cycle:** Fast `com.android.phone` restarter.
            - **One-Click Privilege Auto-Grant:** Auto-configures permissions via APatch / KernelSU / Magisk.
            - **Community & Support:**
              - [Telegram Channel (@MayaXDev)](https://t.me/MayaXDev)
              - [Developer Hub (@Itcalldeveloper)](https://t.me/Itcalldeveloper)
          files: |
            release-artifacts/SIMNumberSetter_v1.1_MayaXDev.apk
            release-artifacts/SIMNumberSetter_v1.1_MayaXDev_Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
